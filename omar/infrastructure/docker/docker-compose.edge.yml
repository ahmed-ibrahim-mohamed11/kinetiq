# Edge host stack: AI pipeline + local monitoring. Run on the gym's GPU server.
#   docker compose -f infrastructure/docker/docker-compose.edge.yml --env-file services/edge-ai/.env up -d
#
# Network design: the edge host has TWO interfaces — one on the camera VLAN (RTSP in),
# one on the gym LAN with internet egress (HTTPS to Supabase only). Cameras never
# reach the internet; the host firewall allows inbound 8088/9090/3000 from the admin
# VLAN only.
name: smartgym-edge

services:
  edge-ai:
    image: smartgym/edge-ai:0.1.0
    build:
      context: ../..
      dockerfile: infrastructure/docker/edge-ai.Dockerfile
    restart: unless-stopped
    env_file:
      - ../../services/edge-ai/.env
    environment:
      EDGE_DATA_DIR: /data
      EDGE_CAMERAS_FILE: /config/cameras.yaml
      EDGE_CAMERA_SECRETS_FILE: /config/camera-credentials.yaml
      # The template-encryption key is a Docker secret mounted outside the data volume; it takes
      # precedence over EDGE_BIOMETRIC_KEY_B64, which must stay unset in .env on production hosts.
      EDGE_BIOMETRIC_KEY_FILE: /run/secrets/edge_biometric_key
    volumes:
      - edge-data:/data
      - ../../services/edge-ai/config:/config:ro
      - ../../services/edge-ai/models:/models:ro
    secrets:
      - edge_biometric_key
    ports:
      - "127.0.0.1:8088:8088"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    volumes:
      - /:/host:ro,rslave
    command: ["--path.rootfs=/host"]

  dcgm-exporter:
    # NVIDIA GPU metrics (utilization, memory, temperature). Requires nvidia-container-toolkit.
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.8-3.6.0-ubuntu22.04
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    cap_add: [SYS_ADMIN]

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    ports:
      - "127.0.0.1:3000:3000"
    secrets:
      - grafana_admin_password

secrets:
  grafana_admin_password:
    file: ../../secrets/grafana_admin_password # gitignored; create before `up`
  edge_biometric_key:
    file: ../../secrets/edge_biometric_key # gitignored; 32 random bytes, base64 — see docs/deployment/edge-device.md

volumes:
  edge-data:
  prom-data:
  grafana-data:
