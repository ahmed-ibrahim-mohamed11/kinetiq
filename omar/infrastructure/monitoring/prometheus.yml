global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: edge-ai
    static_configs:
      - targets: ["edge-ai:8088"]
    metrics_path: /metrics
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: gpu
    static_configs:
      - targets: ["dcgm-exporter:9400"]
