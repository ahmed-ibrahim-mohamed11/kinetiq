[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartgym-edge-ai"
version = "0.1.0"
description = "Edge AI service: camera ingest, detection, multi-camera tracking, equipment association, rep/set counting, durable event sync."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "cryptography>=43.0",
  "structlog>=24.4",
]

[project.optional-dependencies]
# Real camera / inference stack. Installed in the Docker image; optional for unit tests.
cv = [
  # <5: OpenCV 5 drops the bundled Haar cascades used by the default (no-download) face detector.
  "opencv-python-headless>=4.10,<5",
  "onnxruntime-gpu>=1.19; sys_platform != 'darwin'",
  "onnxruntime>=1.19; sys_platform == 'darwin'",
  "scipy>=1.13",
  "onvif-zeep>=0.2.12",
  "defusedxml>=0.7",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
]

[project.scripts]
edge-ai = "edge_ai.__main__:main"

[tool.setuptools.packages.find]
include = ["edge_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]
ignore = ["S101"]  # assert statements are used for invariants and in tests

[tool.ruff.lint.per-file-ignores]
# Tests and dev tools use fixed dev-only secrets and long literal fixtures by design.
"tests/*" = ["S105", "S106", "E501"]
"edge_ai/tools/*" = ["S106", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
