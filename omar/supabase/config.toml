# Supabase CLI project configuration.
# `supabase start` runs the full stack locally (Postgres, Auth, Storage, Edge Runtime).
project_id = "ai-smart-gym"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17 # matches the linked cloud project (Postgres 17.11); embedded test DB is 18

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

# Private bucket for floor plan images — admins only via RLS on storage.objects.
[storage.buckets.floor-plans]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/svg+xml"]

[auth]
enabled = true
# Production apps on Vercel (team ahmed-1ff6). Localhost entries keep local development working.
site_url = "https://smartgym-member-ahmed-1ff6.vercel.app"
additional_redirect_urls = [
  "https://smartgym-member-ahmed-1ff6.vercel.app",
  "https://smartgym-admin-ahmed-1ff6.vercel.app",
  "http://localhost:3000",
  "http://localhost:3001",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false # members are created by staff, then invited

[auth.email]
# Must stay true: this key maps to the email *provider* (sign-in as well as sign-up). Public
# registration is blocked by `auth.enable_signup = false` above; staff create and invite users.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.ingest-events]
verify_jwt = false # device HMAC auth instead; see supabase/functions/ingest-events

[functions.device-sync]
verify_jwt = false # device HMAC auth; see supabase/functions/device-sync

[functions.qr-token]
verify_jwt = true

[analytics]
enabled = false
